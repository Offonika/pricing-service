name: Docs manifest

"on":
  workflow_dispatch:
  push:
    paths:
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/config.toml"
      - "docs/index.md"
      - "docs/manifest.yml"
      - "docs/specs/**"
      - "openapi.yaml"
      - ".github/workflows/docs-manifest.yml"
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/config.toml"
      - "docs/index.md"
      - "docs/manifest.yml"
      - "docs/specs/**"
      - "openapi.yaml"
      - ".github/workflows/docs-manifest.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pricing-service
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs tooling
        run: python -m pip install "PyYAML>=6.0,<7"

      - name: Validate pricing-service project docs
        run: python .github/scripts/validate_project_docs.py
