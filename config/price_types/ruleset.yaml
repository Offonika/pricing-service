# Единый машинный справочник правил контура «Типы цен».
# ИСТОЧНИК ИСТИНЫ для нормативов: скрипты, blueprint и линтер читают этот файл.
# Изменение правила = правка здесь + пересборка (см. README ревизионного пакета).
ruleset_version: "2026-07-18.1"
effective_date: "2026-07-18"

population:
  buyers_root_group_ref: "0x859f00215d1c454811df26d4ab62d095" # группа ПОКУПАТЕЛИ
  contract_kind_ref: "0x9363c6f0a10557bf4822a55db4862286" # вид договора "С покупателем"
  excluded_registry_classes: # классы реестра служебных карточек вне расчета
    - "служебный инструмент"
    - "фиктивная/техническая"
    - "карточка сотрудника"
  hygiene_registry_classes: # в расчете, но с пометкой гигиены
    - "точка без владельца"

window:
  months: 3 # итог продаж за N полных закрытых месяцев
  run: "раз в месяц, после закрытия месяца (cron 1-го числа 06:45)"
  presignal_days_before_month_end: 7

# Нормативы сохранения уровня (итог 3 полных месяцев) и порог удержания
# (последний месяц >= норматив/3). Утверждено 2026-07-18.
levels:
  bronze:
    price_type_prefix: "2.Бронзовый"
    retention_norm_3m: 10000
    hold_last_month: 3300
    downgrade_to: "Розница"
    guarantee_days: 45
  silver:
    price_type_prefix: "3.Серебряный"
    retention_norm_3m: 330000
    hold_last_month: 110000
    downgrade_to: "2.Бронзовый"
    guarantee_days: 50
  gold:
    price_type_prefix: "4.Золотой"
    retention_norm_3m: 900000
    hold_last_month: 300000
    downgrade_to: "3.Серебряный"
    guarantee_days: 60
  platinum:
    price_type_prefix: "5.Платиновый"
    retention_norm_3m: 2900000
    hold_last_month: 967000
    downgrade_to: "4.Золотой"
    guarantee_days: 60 # решение 2026-07-18: пока 60, пересмотреть

upgrades:
  frozen: true # решение 2026-07-17/18: переводы вверх не выполняются вообще
  candidates_informational_only: true
  retail_to_b2b: "подсветка раз в месяц при первом расчете; подъем только ручной B2B-квалификацией"

downgrade:
  max_steps_per_cycle: 1
  requires: "изолятор/реанимация 1 полный месяц + утверждение человеком"
  isolate_months: 1
  dead_souls_exception: "12+ мес нуля -> сразу Розница (решение 2026-07-18)"

sleeping:
  zero_months_to_recovery: 3 # 3 мес нуля -> месяц CRM-реанимации
  dead_after_months: 12 # 12+ мес нуля -> чистка в Розницу
  comeback: "уровень возвращается закупками, без испытательного срока"

economics:
  mandatory_recovery:
    status: "ok"
    profitability_min_pct: 40
  gross_buckets: # разбиение обязательной реанимации по валовой за 3м
    micro_max: 500
    working_max: 1000
    good_min: 1000
  priority_recovery:
    gross_min: 2000
    profitability_min_pct: 60
  data_mismatch_max_pct: 5 # расхождение оборота и выручки 1С -> "нужна сверка"

returns:
  market_median_new_pct: 15 # справочно: норма рынка (калибровка 2026-07-18)
  elevated_new_pct: 25 # "повышенные возвраты новым"
  spike_new_pct: 40 # "сверхнормативные (мозга-шпиль)"
  fitting_top_model_share_pct: 60 # концентрация на одной модели = подбор запчасти
  min_sales_docs: 5
  min_return_docs: 5
  one_off_max_sales_docs: 2 # "разовая сделка"
  one_off_min_return_rate_pct: 90
  history_bands: { low_max_sales: 5000, medium_max_sales: 15000 }
  policy: "для всех характеров - только информационная лампочка, без автосанкций"

exceptions:
  veteran_return: # ветеранское исключение (2026-07-18)
    min_relationship_months: 18
    requires: "положительная карточка, выгодная экономика; ручное утверждение с аргументами менеджера"
  key_account: "только личным решением руководителя; порога нет; автоматика не трогает"
  new_client: "нет полного календарного месяца поведения -> не трогать"
  bronze_entry: "мастерам/СЦ бронза с первого договора (рыночный стандарт)"

identity:
  unique_key: "counterparty_ref (hex _Reference54._IDRRef, нормализация: lower-case)"
  stable_key_formula: "counterparty_ref + snapshot_month (модель хранения карточек - открытый вопрос владельцу: одна карточка навсегда или на цикл)"

decision_log:
  - { date: "2026-07-10", decision: "правило бронзы: итог 3м < 10к и последний месяц < 3.3к -> изолятор" }
  - { date: "2026-07-12", decision: "пересчет предложений: изолятор 816, удержание 249; немедленных переводов нет" }
  - { date: "2026-07-17", decision: "заморозка повышений; бронза с первого договора; ветка спящих; подсветка Розницы раз в месяц; реестр служебных" }
  - { date: "2026-07-18", decision: "нормативы 330к/900к/2900к (+удержание /3); гарантия платины 60; мертвые души всех уровней -> Розница; экономика вариант Б; Key Account вручную; черная метка 3 шпилям; мораторий РБ034611; ветеранское исключение 18м+; политика 'пока только лампочка'" }

# Для линтера: значения, признанные устаревшими (не должны встречаться в
# актуальных нормативных документах вне разделов истории решений).
superseded_values:
  - "250 000"
  - "2 100 000"
  - "2,1 млн"
  - "2.1 млн"
  - "990 000"
  - "1 200 000"
  - "2 500 000"
  - "от 5 000₽ до 300 000₽"
# Маркеры контекста истории: строка или ближайший заголовок с таким словом
# разрешает устаревшее значение.
history_markers:
  - "истори"
  - "промежуточн"
  - "устар"
  - "итераци"
  - "снижено"
  - "superseded"
  - "решение 2026-07"
  - "было"
