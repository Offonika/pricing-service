[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-service"
version = "0.1.0"
description = "Умное ценообразование Master Mobile (FastAPI + SQLAlchemy + Alembic)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.29",
    "sqlalchemy-pytds>=1.0.2",
    "alembic>=1.13.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "requests>=2.31.0,<3",
    "beautifulsoup4>=4.12.0,<5",
    "playwright>=1.44.0,<2",
    "openai>=1.51.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2,<3",
    "pillow>=11.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
build = [
    "pip-tools==7.5.3",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "black>=24.4.0",
    "PyYAML>=6.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
  \.venv
  | \.venv\.bak_[^/]+
  | ui/dist
)/
'''

[tool.setuptools.packages.find]
include = ["app"]
exclude = ["tests", "alembic", "infra", "docs", "tasks"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".venv.bak_*", "ui/dist"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
ignore = ["E501", "UP006", "UP017", "UP035", "UP038", "UP045"]
per-file-ignores = { "app/api/*.py" = ["B008"] }

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
